<div id="screen-landing" class="screen">
        <div class="top-bar">
            <div class="user-info-area">
                <span id="user-display" class="user-tag">User</span>
                <button class="btn-sm btn-secondary logout-btn" onclick="logout()">Logout</button>
            </div>
            <div class="coins-display" style="display:flex; align-items:center; gap:10px;">
                <span>🎟️ <span id="landing-credits">0</span> <button class="btn-sm btn-primary" onclick="refillCredits()" style="padding:2px 8px; font-size:0.8rem;">+</button></span>
                <span>|</span>
                <span>🎼 <span id="landing-t-coins">0</span></span> 
                <span>𝄢 <span id="landing-b-coins">0</span></span>
            </div>
        </div>
        <div class="scroll-content">
            <h3 style="margin-bottom:10px;">Select Clef</h3>
            <div class="toggle-group" style="transform:scale(1.1)">
                <div class="toggle-opt selected" id="clef-treble" onclick="setClef('treble')">Treble 🎼</div>
                <div class="toggle-opt" id="clef-bass" onclick="setClef('bass')">Bass 𝄢</div>
            </div>
            <h4 style="margin-bottom:5px; margin-top:20px;">My Instruments</h4>
            <div class="instrument-bag" id="landing-bag"></div>
            <div class="card-menu">
                <div class="menu-card" onclick="goToStore()">
                    <div class="menu-icon">🏪</div>
                    <div>Store</div>
                </div>
                <div class="menu-card" onclick="startGame('coin')">
                    <div class="menu-icon">🏃‍♀️</div>
                    <div>Coin Run</div>
                </div>
                <div class="menu-card" onclick="goToSongs()">
                    <div class="menu-icon">🎶</div>
                    <div>Song Mode</div>
                </div>
            </div>
        </div>
    </div>
